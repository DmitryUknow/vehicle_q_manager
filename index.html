  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

    }

    &lt;div id=&quot;daily-panel&quot; class=&quot;cadence-panel is-active&quot; role=&quot;region&quot; aria-labelledby=&quot;daily-button&quot;&gt;
      &lt;div&gt;
        &lt;h2&gt;Daily operational control&lt;/h2&gt;
        &lt;ul&gt;
          &lt;li&gt;Review new warranty claims, critical customer complaints, DTC logs, photos and returned-part requests.&lt;/li&gt;
          &lt;li&gt;Join the factory quality meeting and define priorities, owners and due dates.&lt;/li&gt;
          &lt;li&gt;Walk the assembly line and observe critical operations, torque control, connector installation and adjustment processes.&lt;/li&gt;
          &lt;li&gt;Inspect blocked vehicles, work-in-process, reworked units and suspect component batches.&lt;/li&gt;
          &lt;li&gt;Review end-of-line, PDI and road-test defects and compare them with field complaints.&lt;/li&gt;
          &lt;li&gt;Follow up open 8D actions, containment checks and overdue investigations.&lt;/li&gt;
          &lt;li&gt;Escalate safety, regulatory, stop-shipment and high-cost risks.&lt;/li&gt;

          &lt;li&gt;Blocked VINs and component lots&lt;/li&gt;
          &lt;li&gt;Containment results&lt;/li&gt;
          &lt;li&gt;Action owners and deadlines&lt;/li&gt;

          &lt;li&gt;Hold cross-functional problem-solving reviews with the plant, engineering, suppliers and warranty teams.&lt;/li&gt;
          &lt;li&gt;Audit critical or recently changed processes and verify implementation on the shop floor.&lt;/li&gt;
          &lt;li&gt;Review returned-part analysis, NTF cases and supplier 8D reports.&lt;/li&gt;
          &lt;li&gt;Update the risk list, corrective-action tracker, clean points and affected VIN ranges.&lt;/li&gt;
          &lt;li&gt;Report progress, overdue actions and required management decisions.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;Weekly deliverables&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;Warranty Pareto and trend report&lt;/li&gt;
          &lt;li&gt;Open issue and 8D tracker&lt;/li&gt;
          &lt;li&gt;Audit findings&lt;/li&gt;
          &lt;li&gt;Action effectiveness status&lt;/li&gt;
          &lt;li&gt;Management escalation list&lt;/li&gt;

          &lt;li&gt;Support new-model launches, trial builds and the first mass-production batches.&lt;/li&gt;
          &lt;li&gt;Approve or update inspection procedures, control plans and PDI checklists after a new defect.&lt;/li&gt;
          &lt;li&gt;Conduct special audits after process, software, component or supplier changes.&lt;/li&gt;
          &lt;li&gt;Organise stop-shipment, vehicle inspection, sorting or rework for critical issues.&lt;/li&gt;
          &lt;li&gt;Support service campaigns or recalls: affected VIN definition, repair procedure, parts and cost estimation.&lt;/li&gt;
          &lt;li&gt;Visit suppliers, dealers or technical centres for joint investigations.&lt;/li&gt;
          &lt;li&gt;Transfer lessons learned to other models, processes and future launches.&lt;/li&gt;
        &lt;/ul&gt;

          &lt;li&gt;Major process change&lt;/li&gt;

          &lt;li&gt;Visual, functional, mechanical and diagnostic inspections.&lt;/li&gt;
          &lt;li&gt;Body gaps, paint, corrosion, damage and water-leak checks.&lt;/li&gt;
          &lt;li&gt;Steering, suspension, braking, wheel alignment, noise and vibration checks.&lt;/li&gt;
          &lt;li&gt;Infotainment, heating, electrical and ADAS function checks.&lt;/li&gt;

          &lt;li&gt;Quarantine and identify suspect vehicles and components.&lt;/li&gt;
          &lt;li&gt;Define inspection, sorting and rework instructions.&lt;/li&gt;
          &lt;li&gt;Verify repaired vehicles before release.&lt;/li&gt;
          &lt;li&gt;Maintain VIN, component lot and machine-kit traceability.&lt;/li&gt;
          &lt;li&gt;Confirm the clean point before normal shipment resumes.&lt;/li&gt;

      &lt;/section&gt;

  &lt;section id=&quot;responsibility-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;responsibility-tab&quot; hidden&gt;
    &lt;h2&gt;Where did the defect originate?&lt;/h2&gt;
    &lt;p class=&quot;text-muted&quot;&gt;Select a source to see what must be checked before responsibility is assigned.&lt;/p&gt;
    &lt;div class=&quot;source-grid&quot; id=&quot;source-buttons&quot; aria-label=&quot;Select a potential defect source&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; aria-live=&quot;polite&quot;&gt;
      &lt;div class=&quot;detail-layout&quot;&gt;
        &lt;div&gt;
          &lt;h2 id=&quot;source-title&quot;&gt;&lt;/h2&gt;
          &lt;p id=&quot;source-description&quot;&gt;&lt;/p&gt;
          &lt;h3&gt;Evidence to review&lt;/h3&gt;
          &lt;ul id=&quot;source-evidence&quot;&gt;&lt;/ul&gt;
        &lt;/div&gt;
        &lt;aside&gt;
          &lt;h3&gt;Typical examples&lt;/h3&gt;
          &lt;ul id=&quot;source-examples&quot;&gt;&lt;/ul&gt;
        &lt;/aside&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;footer-note&quot;&gt;&lt;strong&gt;Rule:&lt;/strong&gt; confirm both the occurrence root cause—why the defect happened—and the escape root cause—why the control system failed to detect it.&lt;/p&gt;
  &lt;/section&gt;

  &lt;section id=&quot;interfaces-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;interfaces-tab&quot; hidden&gt;
    &lt;h2&gt;Cross-functional coordination&lt;/h2&gt;
    &lt;p class=&quot;text-muted&quot;&gt;The role manages the quality process even when the participants do not report directly to the Quality Manager.&lt;/p&gt;
    &lt;div class=&quot;interface-grid&quot; id=&quot;interface-buttons&quot; aria-label=&quot;Select an interface&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; aria-live=&quot;polite&quot;&gt;
      &lt;div class=&quot;detail-layout&quot;&gt;
        &lt;div&gt;
          &lt;h2 id=&quot;interface-title&quot;&gt;&lt;/h2&gt;
          &lt;p id=&quot;interface-purpose&quot;&gt;&lt;/p&gt;
          &lt;h3&gt;Manager activities&lt;/h3&gt;
          &lt;ul id=&quot;interface-actions&quot;&gt;&lt;/ul&gt;
        &lt;/div&gt;
        &lt;aside&gt;
          &lt;h3&gt;Documents and records&lt;/h3&gt;
          &lt;ul id=&quot;interface-documents&quot;&gt;&lt;/ul&gt;
        &lt;/aside&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h2&gt;Core performance indicators&lt;/h2&gt;
    &lt;div class=&quot;metric-list&quot; aria-label=&quot;Quality performance indicators&quot;&gt;
      &lt;div class=&quot;metric-item&quot;&gt;&lt;strong&gt;Claim rate&lt;/strong&gt;&lt;span&gt;Warranty claims per 1,000 vehicles&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;metric-item&quot;&gt;&lt;strong&gt;Recurrence&lt;/strong&gt;&lt;span&gt;Repeated defects after corrective action&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;metric-item&quot;&gt;&lt;strong&gt;Closure time&lt;/strong&gt;&lt;span&gt;Time from detection to verified closure&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;metric-item&quot;&gt;&lt;strong&gt;Warranty cost&lt;/strong&gt;&lt;span&gt;Repair and campaign cost per vehicle&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;metric-item&quot;&gt;&lt;strong&gt;Action delivery&lt;/strong&gt;&lt;span&gt;Corrective actions completed on time&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;metric-item&quot;&gt;&lt;strong&gt;NTF rate&lt;/strong&gt;&lt;span&gt;Returned parts with no confirmed fault&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;metric-item&quot;&gt;&lt;strong&gt;PDI escape&lt;/strong&gt;&lt;span&gt;Field defects that factory controls missed&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;metric-item&quot;&gt;&lt;strong&gt;Audit effectiveness&lt;/strong&gt;&lt;span&gt;Repeat findings and sustained compliance&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;contract-quality-manager-viz&#x27;);

      const cadenceButtons = [
        root.querySelector(&#x27;#daily-button&#x27;),
        root.querySelector(&#x27;#weekly-button&#x27;),
        root.querySelector(&#x27;#event-button&#x27;)
      ];
      const cadencePanels = [
        root.querySelector(&#x27;#daily-panel&#x27;),
        root.querySelector(&#x27;#weekly-panel&#x27;),
        root.querySelector(&#x27;#event-panel&#x27;)
      ];

      cadenceButtons.forEach((button, selectedIndex) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          cadenceButtons.forEach((item, index) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(index === selectedIndex)));
          cadencePanels.forEach((panel, index) =&gt; panel.classList.toggle(&#x27;is-active&#x27;, index === selectedIndex));
        });
      });

      const warrantyStages = [
        {
          title: &#x27;Claim intake&#x27;,
          purpose: &#x27;Collect a complete, traceable description of the customer complaint before technical analysis begins.&#x27;,
          actions: [
            &#x27;Review the complaint, VIN, mileage, production date, symptom and repair information.&#x27;,
            &#x27;Check photos, videos, DTCs, diagnostic logs and replaced-part details.&#x27;,
            &#x27;Request missing evidence from the warranty team, dealer or service centre.&#x27;,
            &#x27;Link the vehicle to its machine kit, component lots, software level, shift and production records.&#x27;
          ],
          outputs: [&#x27;Validated claim record&#x27;, &#x27;Evidence request&#x27;, &#x27;Initial defect classification&#x27;]
        },
        {
          title: &#x27;Claim validation&#x27;,
          purpose: &#x27;Determine whether the complaint is confirmed, warranty-related and relevant to product or process quality.&#x27;,
          actions: [
            &#x27;Compare the complaint with warranty conditions and technical requirements.&#x27;,
            &#x27;Separate production defects from misuse, external damage or incorrect dealer repair.&#x27;,
            &#x27;Identify duplicate claims and No Trouble Found cases.&#x27;,
            &#x27;Check whether similar symptoms have already been reported.&#x27;
          ],
          outputs: [&#x27;Accepted or rejected claim&#x27;, &#x27;NTF status&#x27;, &#x27;Known-issue link&#x27;]
        },
        {
          title: &#x27;Data analysis&#x27;,
          purpose: &#x27;Convert individual complaints into a structured picture of frequency, trend, exposure and cost.&#x27;,
          actions: [
            &#x27;Classify by model, system, symptom, component, supplier, date, mileage and repair cost.&#x27;,
            &#x27;Build Pareto charts and trend analyses.&#x27;,
            &#x27;Compare claims with PDI, end-of-line, audit and production data.&#x27;,
            &#x27;Identify common VIN ranges, component lots, shifts, software versions or machine kits.&#x27;
          ],
          outputs: [&#x27;Warranty Pareto&#x27;, &#x27;Trend report&#x27;, &#x27;Potential affected population&#x27;]
        },
        {
          title: &#x27;Risk prioritisation&#x27;,
          purpose: &#x27;Focus resources on the issues with the greatest customer, safety, legal, production or financial impact.&#x27;,
          actions: [
            &#x27;Assess safety and regulatory risk first.&#x27;,
            &#x27;Evaluate loss of function, customer impact, frequency growth and warranty cost.&#x27;,
            &#x27;Define the escalation level and investigation timing.&#x27;,
            &#x27;Recommend stop-shipment, stop-build or field action when justified.&#x27;
          ],
          outputs: [&#x27;Risk level&#x27;, &#x27;Priority ranking&#x27;, &#x27;Escalation decision&#x27;]
        },
        {
          title: &#x27;Containment&#x27;,
          purpose: &#x27;Protect customers and prevent additional suspect vehicles from leaving the plant while the cause is unknown.&#x27;,
          actions: [
            &#x27;Block suspect VINs, machine kits and component lots.&#x27;,
            &#x27;Launch 100% inspection, sorting, temporary rework or additional diagnostics.&#x27;,
            &#x27;Define the inspection method, acceptance criteria and release authority.&#x27;,
            &#x27;Identify the suspect range and establish a clean point.&#x27;
          ],
          outputs: [&#x27;Containment instruction&#x27;, &#x27;Blocked VIN list&#x27;, &#x27;Clean-point definition&#x27;]
        },
        {
          title: &#x27;Technical investigation&#x27;,
          purpose: &#x27;Reproduce the symptom, locate the failure and collect evidence from the vehicle, part and assembly process.&#x27;,
          actions: [
            &#x27;Inspect affected vehicles and compare good and defective samples.&#x27;,
            &#x27;Arrange returned-part shipment and joint analysis with the plant or supplier.&#x27;,
            &#x27;Review measurements, torque records, software versions, diagnostic data and process history.&#x27;,
            &#x27;Observe the assembly operation and interview responsible operators and engineers.&#x27;
          ],
          outputs: [&#x27;Technical investigation report&#x27;, &#x27;Returned-part analysis&#x27;, &#x27;Confirmed failure mode&#x27;]
        },
        {
          title: &#x27;Root-cause analysis&#x27;,
          purpose: &#x27;Explain why the defect occurred and why existing controls allowed it to escape.&#x27;,
          actions: [
            &#x27;Apply 5 Why, Ishikawa, 8D, fault-tree or comparative analysis as appropriate.&#x27;,
            &#x27;Separate the occurrence root cause from the escape root cause.&#x27;,
            &#x27;Confirm the responsible area using objective evidence.&#x27;,
            &#x27;Reject weak conclusions such as “operator error” unless the system cause is demonstrated.&#x27;
          ],
          outputs: [&#x27;Verified root cause&#x27;, &#x27;Responsibility assignment&#x27;, &#x27;8D analysis&#x27;]
        },
        {
          title: &#x27;Permanent correction&#x27;,
          purpose: &#x27;Remove the root cause and strengthen controls so that the defect cannot recur or escape.&#x27;,
          actions: [
            &#x27;Change the process, parameters, tooling, component, software, packaging or work sequence.&#x27;,
            &#x27;Introduce Poka-Yoke, automatic recording or additional inspection where justified.&#x27;,
            &#x27;Update work instructions, control plans, PDI checklists and training materials.&#x27;,
            &#x27;Assign owners and dates and monitor implementation at the shop floor.&#x27;
          ],
          outputs: [&#x27;Corrective-action plan&#x27;, &#x27;Updated quality documents&#x27;, &#x27;Implementation evidence&#x27;]
        },
        {
          title: &#x27;Effectiveness &amp; closure&#x27;,
          purpose: &#x27;Prove that actions work in production and that the field complaint rate remains under control.&#x27;,
          actions: [
            &#x27;Inspect initial batches after the clean point and audit the changed process.&#x27;,
            &#x27;Monitor production, PDI and warranty data for recurrence.&#x27;,
            &#x27;Compare pre-action and post-action results.&#x27;,
            &#x27;Close the issue only after sustained effectiveness is demonstrated.&#x27;
          ],
          outputs: [&#x27;Effectiveness evidence&#x27;, &#x27;Closure approval&#x27;, &#x27;Lessons learned&#x27;]
        },
        {
          title: &#x27;Field action&#x27;,
          purpose: &#x27;Correct vehicles already delivered when the defect population or risk requires a campaign.&#x27;,
          actions: [
            &#x27;Define affected VINs and the technical repair method.&#x27;,
            &#x27;Support service bulletin, campaign or recall preparation.&#x27;,
            &#x27;Estimate parts, labour, timing and warranty cost.&#x27;,
            &#x27;Monitor dealer completion and feedback from repaired vehicles.&#x27;
          ],
          outputs: [&#x27;Affected VIN population&#x27;, &#x27;Repair procedure&#x27;, &#x27;Campaign progress report&#x27;]
        }
      ];

      const defectSources = [
        {
          title: &#x27;Machine kit / supplied component&#x27;,
          description: &#x27;The condition was already present in an imported assembly or component before the contract plant operation.&#x27;,
          evidence: [&#x27;Incoming inspection records&#x27;, &#x27;Supplier lot and serial number&#x27;, &#x27;Packaging condition&#x27;, &#x27;Good-versus-defective part comparison&#x27;, &#x27;Supplier manufacturing and test data&#x27;],
          examples: [&#x27;Internal component failure&#x27;, &#x27;Incorrect dimension&#x27;, &#x27;Paint defect present before shipment&#x27;, &#x27;Faulty infotainment unit&#x27;]
        },
        {
          title: &#x27;Transport and storage&#x27;,
          description: &#x27;The product was damaged or degraded between dispatch, warehousing and delivery to the assembly line.&#x27;,
          evidence: [&#x27;Container and packaging photos&#x27;, &#x27;Humidity and storage conditions&#x27;, &#x27;Handling records&#x27;, &#x27;Damage location and pattern&#x27;, &#x27;Time spent in storage&#x27;],
          examples: [&#x27;Corrosion&#x27;, &#x27;Scratches or dents&#x27;, &#x27;Water ingress&#x27;, &#x27;Connector or trim damage&#x27;]
        },
        {
          title: &#x27;Assembly process&#x27;,
          description: &#x27;The component was acceptable, but the vehicle was assembled, adjusted or programmed incorrectly.&#x27;,
          evidence: [&#x27;Torque traceability&#x27;, &#x27;Operator and shift records&#x27;, &#x27;Tool status and calibration&#x27;, &#x27;Work instructions&#x27;, &#x27;Process audit and line observation&#x27;],
          examples: [&#x27;Loose fastener&#x27;, &#x27;Unseated connector&#x27;, &#x27;Pinched harness&#x27;, &#x27;Incorrect wheel alignment&#x27;]
        },
        {
          title: &#x27;Software or calibration&#x27;,
          description: &#x27;The hardware is functional, but the installed software, coding, parameters or update process creates the symptom.&#x27;,
          evidence: [&#x27;Software and calibration version&#x27;, &#x27;Programming logs&#x27;, &#x27;DTC history&#x27;, &#x27;Reproduction conditions&#x27;, &#x27;Comparison after software update&#x27;],
          examples: [&#x27;Infotainment freezing&#x27;, &#x27;Incorrect warning message&#x27;, &#x27;Heating control logic issue&#x27;, &#x27;Module communication error&#x27;]

      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
